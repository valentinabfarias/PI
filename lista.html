<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Cadastros</title>
  <link rel="stylesheet" href="forms.css">
  <style>
    body {
      display: block;
      padding: 40px 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
    th {
      background: #7b9971;
      color: white;
    }
    tr:hover {
      background: #f5f5f5;
    }
    .vazio {
      text-align: center;
      padding: 40px;
      color: #777;
    }
    .topo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .btn-voltar {
      background: #34502B;
      color: white;
      padding: 8px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topo">
      <h1>Cadastros</h1>
      <a href="PI/pages/map.html" class="btn-voltar">← Voltar ao site</a>
    </div>

    <div id="conteudo"></div>
  </div>

  <script>
    const cadastros = JSON.parse(localStorage.getItem('cadastros')) || [];
    const conteudo = document.getElementById('conteudo');

    if (cadastros.length === 0) {
      conteudo.innerHTML = '<div class="vazio">Nenhum cadastro encontrado.</div>';
    } else {
      let html = `
        <table>
          <thead>
            <tr>
              <th>Nome</th>
              <th>E-mail</th>
              <th>Senha</th>
              <th>Data</th>
            </tr>
          </thead>
          <tbody>
      `;

      // Mostra do mais recente para o mais antigo
      cadastros.slice().reverse().forEach(c => {
        html += `
          <tr>
            <td>${c.nome}</td>
            <td>${c.email}</td>
            <td>${c.senha || '-'}</td>
            <td>${c.data}</td>
          </tr>
        `;
      });

      html += `
          </tbody>
        </table>
        <p style="margin-top:15px; font-weight:600; color:#34502B;">
          Total: ${cadastros.length} cadastro(s)
        </p>
      `;

      conteudo.innerHTML = html;
    }
  </script>
</body>
</html>
