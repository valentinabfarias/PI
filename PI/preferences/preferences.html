<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../components/footer/footer.css">
    <link rel="stylesheet" href="../components/header/header.css">
    <link rel="stylesheet" href="../components/mobile-footer/mobile-footer.css">


</head>
<body>
    <div id="header-element"></div>
        <main>
            <div id="padding">
                <div id="title">
                    <h1>Preferências</h1>
                </div>
                <div class="option">
                    <h2 class="subtitle">Tema do site</h2>
                    <div class="preference-radios-align">
                        <div class="preference-radios-content" id="light-content">
                            <div class="radio-button-input" id="light-input">
                                <input type="radio" name="tema" value="claro">
                                <label>Claro&nbsp;☀️</label>
                            </div>
                        </div>
                        <div class="preference-radios-content" id="dark-content">
                            <div class="radio-button-input" id="dark-input">
                                <input type="radio" name="tema" value="escuro">
                                <label>Escuro&nbsp;🌙</label>
                            </div>
                        </div>
                        <div class="preference-radios-content" id="hc-content">
                            <div class="radio-button-input" id="hc-input">
                                <input type="radio" name="tema" value="alto-contraste">
                                <label>Alto contraste&nbsp;✨</label>
                            </div>
                        </div>


                    </div>
                </div>
            </div>
        </main>

    <div id="footer-element"></div>
    
    <div id="mobile-footer-element"></div>
    <script src="../script.js"></script>
</body>
</html>
